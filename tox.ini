[tox]
envlist =
    py{310,311,312,313,314}-django52{,-sample}
    py{312,313,314}-django60{,-sample}

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
# The -sample envs point the suite at the swapped-in model in
# notifications/tests/sample_notifications. Without them the tests that
# cover swapping are skipped, so nothing checks it.
setenv =
    sample: SAMPLE_APP = 1
commands =
    coverage run --branch --source=notifications manage.py test
deps =
    coverage
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
